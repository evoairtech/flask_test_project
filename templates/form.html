<!DOCTYPE html>
<html>
<head>
    <title>WTForms Example</title>
</head>
<body>
    <h1>WTForms Form Example</h1>

    <form method="POST" action="">
        {{ form.hidden_tag() }}
        {{ form.data.label }}<br>
        {{ form.data(size=40) }}<br><br>
        {{ form.submit() }}
    </form>

    {% for field, errors in form.errors.items() %}
        <p style="color:red;">
            {{ field }}: {{ errors[0] }}
        </p>
    {% endfor %}
</body>
</html>
